name: CodeQL

# Retired 2026-10-30: this mirror is superseded by
# https://github.com/FlashyFinancial/wallet-core and nothing here is updated.
# The push/pull_request/schedule triggers are removed so a dead repository does
# not keep spending runs on a scan nobody reads; the file is kept, runnable by
# hand, so the history of what was checked here stays legible.
on:
  workflow_dispatch:

# One analysis per ref at a time: concurrent pull_request runs restored an
# overlay-base database written by a different codeql-action version and failed
# on the mismatch — a cache collision, not a finding.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: '/language:javascript-typescript'
